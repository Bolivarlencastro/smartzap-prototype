<div mat-dialog-title class="flex justify-between items-center">
  <span class="flex items-center text-lg gap-4">
    {{ dialogTitle | transloco }}
    @if (icon) {
      <mat-icon>{{ icon }}</mat-icon>
    }
  </span>

  <button
    mat-icon-button
    mat-dialog-close
    [matTooltip]="'UI.GENERAL.CLOSE' | transloco"
    class="close-button"
    aria-label="Close"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content>
  <span>{{ dialogDescription | transloco }}</span>
</div>
