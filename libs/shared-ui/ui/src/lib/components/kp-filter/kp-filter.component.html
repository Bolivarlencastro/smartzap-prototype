@if ({ isMobile: isMobile$ | async }; as data) {
  <div class="h-16 w-full py-2 pr-8 flex items-center gap-2 bg-default">
    <kp-global-search-input
      class="grow"
      iconClass="mr-1"
      inputClass="text-base"
      [searchTerm]="currentSearchTerm"
      (filterEvent)="searchTerm($event)"
    ></kp-global-search-input>

    @if (!data.isMobile) {
      <ng-template [ngTemplateOutlet]="content"></ng-template>
    }
  </div>

  @if (data.isMobile) {
    <div class="h-20 px-4 flex items-center gap-3 flex-nowrap overflow-x-auto">
      <ng-template [ngTemplateOutlet]="content"></ng-template>
    </div>
  }

  <mat-divider></mat-divider>
}

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
