<p class="mb-5">
  {{ 'REGULATORY_COMPLIANCE.COMPLIANCE_DIALOG.MESSAGE' | transloco }}
</p>
<form [formGroup]="normativeFormGroup" (ngSubmit)="addCompliance()">
  <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
    <mat-label>
      {{ 'REGULATORY_COMPLIANCE.NORMATIVE_FORM.NAME_PLACEHOLDER' | transloco }}
    </mat-label>
    <input matInput #nameInput id="input-normative-name" [maxlength]="COMPLIANCE_MAX_LENGTH" formControlName="name" />
    <button data-test="button-create-new-normative" mat-icon-button matSuffix type="submit">
      <mat-icon>add</mat-icon>
    </button>
    <mat-hint align="end" class="text-secondary">{{ nameInput?.value.length }} /{{ COMPLIANCE_MAX_LENGTH }}</mat-hint>
  </mat-form-field>
</form>
