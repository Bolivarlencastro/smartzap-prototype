@if (hasError) {
  <mat-icon [matTooltip]="'GENERAL.UNABLE_TO_RENEW' | transloco"> warning </mat-icon>
}
@if (canRenew) {
  <button
    [disabled]="renewDisabled"
    mat-icon-button
    [matTooltip]="'REGULATORY_COMPLIANCE.GENERAL.RENEW' | transloco"
    (click)="onRenew()"
  >
    <mat-icon>refresh</mat-icon>
  </button>
}
<button
  mat-icon-button
  [matTooltip]="'REGULATORY_COMPLIANCE.GENERAL.INACTIVATE' | transloco"
  (click)="onInactivate()"
  [disabled]="inactivateDisabled"
>
  <mat-icon>link_off</mat-icon>
</button>
