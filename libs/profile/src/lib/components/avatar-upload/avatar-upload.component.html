<div
  [style.background-image]="backgroundImage"
  class="border-4 border-neutral-300 dark:border-neutral-500 rounded-full w-64 h-64 flex justify-center items-center cursor-pointer hover:border-primary dark:hover:border-primary transition-all duration-300 bg-cover max-xxs:mx-auto"
  (click)="onClickAvatar()"
  #avatarContainer
  (mouseenter)="toggleShowUploadButton('removeClass')"
  (mouseleave)="toggleShowUploadButton('addClass')"
>
  <div
    #uploadButton
    [ngClass]="{ 'opacity-0': imageSrc || imageToUpload }"
    class="flex items-center gap-2 rounded-lg border-dashed border-2 border-neutral-400 dark:border-neutral-400 px-4 py-2 text-neutral-600 dark:text-neutral-300 transition-all duration-300"
  >
    <span class="material-symbols-outlined">upload</span>
    <p>Selecionar</p>
  </div>
  <input
    type="file"
    name="avatar"
    id="avatar"
    hidden
    accept="image/jpeg, image/png"
    (change)="onFileInputChange()"
    #avatarInput
  />
</div>
<hr class="border-t-1 border-b-0 border-default hidden xxs:block" />
<button mat-flat-button type="button" class="max-xxs:mt-5" (click)="onClickSave()" [disabled]="!imageToUpload">
  <span>{{ 'PROFILE_FEATURE.GENERAL.SAVE' | transloco }}</span>
</button>
