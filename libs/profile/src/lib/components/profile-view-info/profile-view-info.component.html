<div class="flex flex-col">
  <ng-container *ngTemplateOutlet="row; context: { key: 'ein', value: profile?.ein }"></ng-container>
  <ng-container *ngTemplateOutlet="row; context: { key: 'job', value: profile?.profiles?.at(0)?.job }"></ng-container>
  <ng-container
    *ngTemplateOutlet="row; context: { key: 'area_of_activity', value: profile?.profiles?.at(0)?.area_of_activity }"
  ></ng-container>
  <ng-container
    *ngTemplateOutlet="row; context: { key: 'director', value: profile?.profiles?.at(0)?.director }"
  ></ng-container>
  <ng-container
    *ngTemplateOutlet="row; context: { key: 'manager', value: profile?.profiles?.at(0)?.manager }"
  ></ng-container>
  <ng-container
    *ngTemplateOutlet="row; context: { key: 'leader_email', value: profile?.related_user_leader?.email }"
  ></ng-container>
</div>
<!--Row Template-->
<ng-template #row let-key="key" let-value="value">
  <div class="min-h-18">
    <p class="font-bold max-xxs:text-sm">{{ 'PROFILE_FEATURE.GENERAL.PROFILE.' + key | transloco }}:</p>
    <p class="max-xxs:text-sm">{{ value || '—' }}</p>
  </div>
</ng-template>
