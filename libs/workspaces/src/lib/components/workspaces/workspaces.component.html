<div id="workspaces" class="workspaces">
  @if (viewMode$ | async; as viewMode) {
    <div class="workspaces-header">
      <div class="workspaces-brand">
        <img class="workspaces-logo" [src]="workspacesConfig?.logoUrl" alt="Logo Url" />
      </div>
      <div class="workspaces-actions">
        <div class="workspaces-action">
          <kp-menu class="workspaces-menu" [apps]="apps$ | async" buttonVariant="on-navigation"></kp-menu>
        </div>

        @if (canUseListView$ | async) {
          <div class="workspaces-action">
            <button
              mat-icon-button
              class="workspaces-icon-button"
              (click)="toggleViewMode()"
              [matTooltip]="getToggleViewTooltipKey(viewMode) | transloco"
              id="button-workspaces-list-toggle-view"
            >
              <mat-icon>{{ getToggleViewIcon(viewMode) }}</mat-icon>
            </button>
          </div>
        }

        @if (currentWorkspace$ | async) {
          <div class="workspaces-action">
            <button
              mat-icon-button
              class="workspaces-icon-button close-button"
              (click)="back()"
              id="button-workspace-list-close"
            >
              <mat-icon>close</mat-icon>
            </button>
          </div>
        }
      </div>
    </div>
    <div class="workspaces-list-section">
      <kp-workspaces-list
        id="list-workspaces"
        (workspaceSelected)="selectWorkspace($event)"
        [workspaces]="workspaces$ | async"
        [isLoading]="isLoading$ | async"
        [viewMode]="viewMode"
      ></kp-workspaces-list>

      @if (isEmpty$ | async) {
        <div class="workspaces-empty-state">
          <span class="workspaces-empty-message">{{ 'WORKSPACES_FEATURE.WORKSPACE_NOT_FOUND' | transloco }}</span>
          <button
            mat-raised-button
            color="primary"
            class="workspaces-logout-button submit-button"
            id="button-workspaces-list-logout"
            (click)="logout()"
          >
            <mat-icon class="workspaces-logout-icon" svgIcon="logout"></mat-icon>
            <span class="workspaces-logout-label">
              {{ 'WORKSPACES_FEATURE.LOGOUT' | transloco }}
            </span>
          </button>
        </div>
      }
    </div>
    @if (displayAddButton) {
      <a
        mat-mini-fab
        class="workspaces-create-button"
        (click)="onAddWorkspace()"
        color="accent"
        [matTooltip]="'WORKSPACES_FEATURE.CREATE' | transloco"
      >
        <mat-icon class="s-4">add</mat-icon>
      </a>
    }
  }
</div>
