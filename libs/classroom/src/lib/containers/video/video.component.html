<mat-drawer-container class="blank" autosize>
  <mat-drawer #drawer class="h-full w-80 bg-transparent border-0 p-3" mode="side" position="end">
    {{ transcription }}
  </mat-drawer>

  <div class="h-full">
    @if (url$ | async; as src) {
      <kp-player-activity-tracker-wrapper
        (activityEvent)="onTrackingActivity($event)"
        [disableActivityEvents]="isViewingAsUser()"
        #tracker
      >
        @if (showPlayer) {
          <kp-media-player
            [url]="src"
            [currentLanguage]="currentLanguage"
            [class.no-transcription-button]="!transcription"
            [isClassroomVideo]="true"
            (paused)="tracker.pause()"
            (played)="tracker.play()"
          ></kp-media-player>
        }
      </kp-player-activity-tracker-wrapper>
    }
    @if (transcription) {
      <div class="container-button flex justify-center items-center">
        <button
          mat-stroked-button
          color="primary"
          [matTooltip]="'CLASSROOM.HELP_PANEL.CONTENT_PANEL.VIDEO_AUDIO_TRANSCRIPTION' | transloco"
          (click)="drawer.toggle()"
        >
          <mat-icon>keyboard</mat-icon>
          <span class="ml-2.5">{{ 'CLASSROOM.VIDEO_TRANSCRIPTION' | transloco }}</span>
        </button>
      </div>
    }
  </div>
</mat-drawer-container>
