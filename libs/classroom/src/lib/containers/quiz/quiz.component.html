<div [@fadeInOut] class="class-quiz">
  @if (isViewingAsUser()) {
    <div class="quiz-preview-banner">
      <mat-icon class="quiz-preview-banner__icon">visibility</mat-icon>
      <span>{{ 'CLASSROOM.QUIZ.PREVIEW_BANNER' | transloco }}</span>
    </div>
  }

  <div class="quiz-wrapper flex">
    <kp-quiz-card
      class="grow"
      [loading]="loading$ | async"
      [questions]="examQuestions$ | async"
      [answers]="answers$ | async"
      [answeringQuiz]="answeringQuiz$ | async"
      [score]="score$ | async"
      [loadingScore]="loadingScore$ | async"
      [randomizeQuestions]="randomizeQuestions$ | async"
      [randomizeOptions]="randomizeOptions$ | async"
      (answerEvent)="onAnswerer($event)"
      (finishEvent)="onFinishExam()"
    >
    </kp-quiz-card>
  </div>
</div>
