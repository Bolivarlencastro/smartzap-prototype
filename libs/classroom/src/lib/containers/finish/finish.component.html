@if (currentStep$ | async; as currentStep) {
  <div>
    <h1 class="text-2xl mb-4">{{ currentStep.order }}<span>.&nbsp;</span>{{ 'CLASSROOM.FINISH.TITLE' | transloco }}</h1>
    <p class="text-xl subject-description">
      {{ 'CLASSROOM.FINISH.SUBTITLE' | transloco }}
    </p>
    <button
      data-test="button-finish-course"
      mat-flat-button
      color="primary"
      class="mt-4 ml-auto"
      (click)="finishCourse()"
    >
      {{ 'CLASSROOM.FINISH.FINISH_BUTTON' | transloco }}
    </button>
  </div>
}
