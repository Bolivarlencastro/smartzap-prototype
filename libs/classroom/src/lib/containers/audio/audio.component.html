@if (this.url$ | async; as url) {
  @if (isSoundCloud()) {
    <!-- SoundCloud Player -->
    <kp-content-activity-tracker-wrapper
      [startAutomatically]="false"
      [disableActivityEvents]="isViewingAsUser()"
      (activityEvent)="onTrackingActivity($event)"
      [disableInactivityCheck]="true"
      #tracker
    >
      <iframe class="w-full" height="166" [src]="url | kpSafeUrl" title="Audio Content Frame"></iframe>
    </kp-content-activity-tracker-wrapper>
    <!--/ SoundCloud Player -->
  } @else {
    <!-- HTML5 Player -->
    <kp-player-activity-tracker-wrapper
      (activityEvent)="onTrackingActivity($event)"
      #tracker
      [disableActivityEvents]="isViewingAsUser()"
    >
      <kp-media-player
        [url]="url"
        [playerType]="'audio'"
        class="w-full"
        (played)="tracker.play()"
        (paused)="tracker.pause()"
      ></kp-media-player>
    </kp-player-activity-tracker-wrapper>
    <!--/ HTML5 Player -->
  }
}
