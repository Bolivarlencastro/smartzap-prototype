<h2 class="mb-4 text-xl">
  {{ 'COURSE.EVALUATION.TITLE' | transloco }}
</h2>
<mat-divider></mat-divider>
<div mat-dialog-content class="flex flex-col max-h-none">
  <kp-evaluation-content
    [questions]="questions$ | async"
    [isOnCourse]="true"
    [disabled]="!!evaluation"
    [form]="evaluationForm"
  ></kp-evaluation-content>
</div>
<div mat-dialog-actions class="flex justify-end pt-4">
  <button
    mat-flat-button
    (click)="save()"
    [disabled]="evaluationForm.invalid || evaluation"
    id="button-confirm-ok"
    color="primary"
    class="submit-evaluation-override"
  >
    {{ 'GENERAL.SUBMIT' | transloco }}
  </button>
</div>
