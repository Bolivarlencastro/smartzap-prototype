<mat-expansion-panel
  [expanded]="expanded()"
  (opened)="expanded.set(true)"
  (closed)="expanded.set(false)"
  class="quiz-question-form-expansion-panel"
>
  <mat-expansion-panel-header>
    <mat-panel-title>
      {{ 'QUIZ.QUIZ_QUESTION_FORM.HEADER' | transloco: { index: index() } }}
    </mat-panel-title>

    <button
      class="mr-4"
      mat-icon-button
      [disabled]="!canDelete()"
      [attr.aria-label]="'QUIZ.QUIZ_QUESTION_FORM.DELETE_QUESTION' | transloco"
      (click)="onDeleteQuestion($event)"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </mat-expansion-panel-header>

  <kp-editor [value]="questionForm().question_text().value()" (valueChange)="onTitleChange($event)" />

  <div class="quiz-question-form-options">
    @for (option of questionForm().options; let i = $index; track $index) {
      <div class="quiz-question-form-option-row">
        <mat-checkbox
          [attr.aria-label]="'QUIZ.QUIZ_QUESTION_FORM.MARK_CORRECT' | transloco"
          [formField]="option.correct_answer"
        />
        <mat-form-field appearance="outline" class="quiz-question-form-option-field" subscriptSizing="dynamic">
          <input
            matInput
            [placeholder]="'QUIZ.QUIZ_QUESTION_FORM.OPTION_PLACEHOLDER' | transloco"
            [formField]="option.option"
          />
        </mat-form-field>
        @if (!isEditing()) {
          <button
            mat-icon-button
            [disabled]="!canDeleteOption()"
            [attr.aria-label]="'QUIZ.QUIZ_QUESTION_FORM.DELETE_OPTION' | transloco"
            (click)="onDeleteOption(i)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        }
      </div>
    }
  </div>

  @if (!isEditing()) {
    <div class="flex flex-wrap items-center justify-between gap-4 mt-4">
      <button mat-button [disabled]="!canAddOption()" (click)="onAddOption()" class="quiz-question-form-add-option">
        <mat-icon>add</mat-icon>
        {{ 'QUIZ.QUIZ_QUESTION_FORM.ADD_OPTION' | transloco }}
      </button>

      @if (!isEditing()) {
        <mat-slide-toggle [formField]="questionForm().save_to_bank">
          {{ 'QUIZ.QUIZ_QUESTION_FORM.ADD_TO_BANK' | transloco }}
        </mat-slide-toggle>
      }
    </div>
  }
</mat-expansion-panel>
