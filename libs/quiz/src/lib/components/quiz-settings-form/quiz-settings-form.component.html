<div class="quiz-settings-list">
  <section id="quiz-setting-randomize" class="quiz-settings-card">
    <div class="quiz-settings-row">
      <label for="randomizeQuestions" class="quiz-settings-label">
        <span>{{ 'QUIZ.QUIZ_SETTINGS_FORM.RANDOMIZE_QUESTIONS_LABEL' | transloco }}</span>
      </label>
      <mat-slide-toggle id="randomizeQuestions" [formField]="quizForm().randomize_questions" />
    </div>

    @if (isRandomizeEnabled()) {
      <div class="quiz-settings-field">
        <label for="questionsToDisplay">
          {{ 'QUIZ.QUIZ_SETTINGS_FORM.QUESTIONS_TO_SHOW_LABEL' | transloco }}
        </label>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <input
            matInput
            id="questionsToDisplay"
            type="number"
            min="1"
            [max]="questionCount()"
            [formField]="quizForm().questions_to_show"
            [placeholder]="'QUIZ.QUIZ_SETTINGS_FORM.QUESTIONS_TO_SHOW_PLACEHOLDER' | transloco"
          />
          @if (questionsToShowMaxValueError()) {
            <mat-error>{{
              'QUIZ.QUIZ_SETTINGS_FORM.QUESTIONS_TO_SHOW_ERROR_EXCEEDS_COUNT' | transloco: { max: questionCount() }
            }}</mat-error>
          }
        </mat-form-field>
        <p>{{ 'QUIZ.QUIZ_SETTINGS_FORM.QUESTIONS_TO_SHOW_HINT' | transloco }}</p>
      </div>
    }
  </section>

  <section id="quiz-setting-randomize-options" class="quiz-settings-card">
    <div class="quiz-settings-row">
      <label for="randomizeOptions" class="quiz-settings-label">
        <span>{{ 'QUIZ.QUIZ_SETTINGS_FORM.RANDOMIZE_OPTIONS_LABEL' | transloco }}</span>
      </label>
      <mat-slide-toggle id="randomizeOptions" [formField]="quizForm().randomize_options" />
    </div>
  </section>
</div>
