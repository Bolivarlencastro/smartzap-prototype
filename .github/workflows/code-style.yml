name: Code Style

on:
  workflow_call:

jobs:
  style-check:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "npm"

      - name: Read NPM dependencies cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'develop'

      - name: ESLint
        run: npx nx affected --base=$NX_BASE --head=$NX_HEAD --target=lint

      - name: Format Check
        run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - name: Stylelint
        run: npx nx affected --base=$NX_BASE --head=$NX_HEAD --target=stylelint --parallel=2
