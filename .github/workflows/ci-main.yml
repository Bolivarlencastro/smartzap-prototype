name: Continuous Deploy (CD) - production

on:
  workflow_dispatch:
    inputs:
      deploy-all:
        type: boolean
        description: Force deploy of all applications
        default: false

jobs:
  derive-affected:
    uses: ./.github/workflows/derive-affected-projects.yml
    with:
      base-branch-name: 'main'
      return-buildable-projects: ${{ inputs.deploy-all || false }}
      ref: 'main'

  build:
    needs: [ derive-affected ]
    if: needs.derive-affected.outputs.build-changes == 'true'
    uses: ./.github/workflows/build-apps.yml
    with:
      matrix: ${{ needs.derive-affected.outputs.build-matrix }}
      build-configuration: 'production'
      ref: 'main'

  deploy:
    #needs: [ derive-affected, test, build ]
    needs: [ derive-affected, build ]
    uses: ./.github/workflows/production-deploy.yml
    with:
      release-name: ${{ needs.build.outputs.release-name }}
    secrets: inherit

  # This allows us to have a branch protection rule for tests with matrix
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [ derive-affected, build, deploy ]
    if: always()
    steps:
      - name: Run successful!
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Run failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
