name: Cypress E2E

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  cypress-e2e:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 540

    steps:
      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      # --------------------------------
      # Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          docker run --rm \
            --entrypoint sh \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/e2e" \
            -w /e2e \
            cypress/included:15.8.0 \
            -c "npm ci"

      # --------------------------------
      # My Account E2E
      # --------------------------------
      - name: Run Cypress - My Account
        id: my-account-e2e
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/e2e" \
            -w /e2e \
            --add-host=host.docker.internal:host-gateway \
            cypress/included:15.8.0 \
            cypress run \
              --project apps/my-account-e2e \
              --browser chrome
        continue-on-error: true

      - name: Upload report artifact (My Account)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report-my-account
          path: apps/my-account-e2e/cypress/reports/html/index.html

      # --------------------------------
      # Konquest E2E
      # --------------------------------
      - name: Run Cypress - Konquest
        id: konquest-e2e
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CI=true \
            -v "$GITHUB_WORKSPACE:/e2e" \
            -w /e2e \
            --add-host=host.docker.internal:host-gateway \
            cypress/included:15.8.0 \
            cypress run \
              --project apps/konquest-e2e \
              --browser chrome
        continue-on-error: true

      - name: Upload report artifact (Konquest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report-konquest
          path: apps/konquest-e2e/cypress/reports/html/index.html

      # --------------------------------
      # Notifications
      # --------------------------------
      - name: Notify success to Google Chat
        if: steps.my-account-e2e.outcome == 'success' && steps.konquest-e2e.outcome == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H "Content-Type: application/json" \
            -d '{
              "text":"Todos os testes E2E passaram com sucesso! Confira o relatório: '"${ARTIFACT_URL}"'"
            }' "$WEBHOOK_URL"

      - name: Notify failure to Google Chat
        if: steps.my-account-e2e.outcome == 'failure' || steps.konquest-e2e.outcome == 'failure'
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 Falha detectada na suíte de testes E2E! Confira o relatório: '"${ARTIFACT_URL}"'"
            }' "$WEBHOOK_URL"
