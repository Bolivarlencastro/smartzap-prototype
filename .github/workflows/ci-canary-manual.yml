name: (Manual) Deploy Canary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Canary for Deployment
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: 'npm'

      # Install dependencies
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Build application
      - name: Build Canary
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx nx run konquest-web:build --configuration=development

      # Display file structure for debugging
      - name: Display File Structure
        run: ls -R dist

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploy application
      - name: Deploy to AWS
        env:
          AWS_MAX_ATTEMPTS: 10
        run: |
          app="./dist/apps/konquest-web"
          bucket="keeps-canary-release"
          distribution_id="EDLGX9LO71TT7"

          if [ -d "$app" ]; then
            echo "[CANARY] - Deploying app: $app"

            # Sync files to S3
            aws s3 sync --delete "$app" "s3://$bucket"

            # Invalidate CloudFront cache
            aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*"

            echo "[CANARY] - Deployment completed successfully!"
          else
            echo "Application directory not found: $app"
            exit 1
          fi
