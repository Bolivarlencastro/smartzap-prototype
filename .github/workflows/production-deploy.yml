name: deploy - production

on:
  workflow_call:
    inputs:
      release-name:
        description: "The release name for the current version of the applications"
        type: string
        required: true

jobs:
  production-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          path: apps

      - name: Display structure of downloaded files
        run: ls -R

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        if: success()
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy
        if: success()
        run: |
          declare -A buckts
          declare -A cdn

          buckts["./apps/my-account"]="keeps.myacc.prd"
          buckts["./apps/learning-analytics-web"]="keeps-learn-analytics-web-production"
          buckts["./apps/konquest-web"]="keeps.konquest.prd"
          buckts["./apps/smartzap-view"]="keeps-smartzap-view-production"
          buckts["./apps/smartzap-admin"]="keeps-smartzap-web-production"
          buckts["./apps/caixa-agencia"]="caixa-agencies-portal"
          buckts["./apps/caixa-cca-loterica"]="caixa-partners-portal"
          buckts["./apps/checkpoint"]="keeps-checkpoint-prod"
          buckts["./apps/certificate-validator"]="keeps-certificate-validator-prod"

          cdn["./apps/my-account"]="E2WJQ8JTHSPERS"
          cdn["./apps/learning-analytics-web"]="E1SZZQQOAGLR43"
          cdn["./apps/konquest-web"]="EE3136V7ZF0G7"
          cdn["./apps/smartzap-view"]="ETNG3AQSK21Z2"
          cdn["./apps/smartzap-admin"]="E2XA7THA2XTUHS"
          cdn["./apps/caixa-agencia"]="E1SPBI0T9HAWCP"
          cdn["./apps/caixa-cca-loterica"]="E24Z66SG5D595E"
          cdn["./apps/checkpoint"]="E1FBMP1I6IND6G"
          cdn["./apps/certificate-validator"]="E2BPET2EG4BA3R"

          apps=./apps
          ignore_apps=("swagger-portal" "smartzap-e2e" "konquest-e2e" "my-account-e2e")

          keep=2       # sempre manter os 2 últimos releases
          mindays=3    # nunca apagar releases com menos de 3 dias
          today=$(date +%s)

          if [ -d "$apps" ]
          then
          for app in $apps/*; do
              # Extrai o nome/base do diretório da aplicação
              appName=$(basename "$app")

              # Flag para indicar se o app deve ser ignorado
              skip_app=0

              # Verifica se appName está na lista de ignore_apps
              for ignore_app in "${ignore_apps[@]}"; do
                if [ "$appName" = "$ignore_app" ]; then
                  echo "[SKIP] Bypassing deploy for: $app"
                  skip_app=1
                  break # Sai do loop interno pois já encontrou um app para ignorar
                fi
              done

              # Pula para a próxima iteração do loop principal se skip_app é 1
              if [ $skip_app -eq 1 ]; then
                continue
              fi

              echo "[PRODUCTION] Deploying app: $app"
              pushd "$app"

              bucket=${buckts[${app}]}
              dist=${cdn[${app}]}

              # --- Deploy ---
              aws s3 sync . s3://$bucket/releases/${{ inputs.release-name }}
              aws s3 cp ./index.html s3://$bucket/
              aws s3 sync ./assets s3://$bucket/assets --delete
              AWS_MAX_ATTEMPTS=10 aws cloudfront create-invalidation --distribution-id $dist --paths "/index.html" "/assets/*"
              sleep 3

              # --- Cleanup old releases ---
              echo "[CLEANUP] Cleaning old releases for $app (bucket: $bucket)"
              releases=$(aws s3 ls s3://$bucket/releases/ | awk '{print $2}' | sort)

              if [ -n "$releases" ]; then
                count=$(echo "$releases" | wc -l)

                if [ "$count" -gt "$keep" ]; then
                  candidates=$(echo "$releases" | head -n -$keep)
                  for rel in $candidates; do
                    datepart=$(echo "$rel" | cut -d'-' -f1)
                    timepart=$(echo "$rel" | cut -d'-' -f2 | cut -c1-4)
                    rel_date=$(date -d "${datepart:0:4}-${datepart:4:2}-${datepart:6:2} ${timepart:0:2}:${timepart:2:2}" +%s)
                    age_days=$(( (today - rel_date) / 86400 ))

                    if [ $age_days -lt $mindays ]; then
                      echo "[SKIP] $rel is too recent ($age_days days old, min $mindays)"
                      continue
                    fi

                    echo "[DELETE] s3://$bucket/releases/$rel (age $age_days days)"
                    aws s3 rm s3://$bucket/releases/$rel --recursive
                  done
                else
                  echo "[INFO] Nothing to cleanup, only $count releases found"
                fi
              fi

              popd
          done
          fi

