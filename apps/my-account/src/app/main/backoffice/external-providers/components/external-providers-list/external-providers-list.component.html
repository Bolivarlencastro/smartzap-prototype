<div class="grow bg-card">
  <mat-table class="h-full" [dataSource]="providers">
    <ng-container matColumnDef="icon">
      <mat-header-cell *matHeaderCellDef class="min-w-[100px]"> Ícone </mat-header-cell>
      <mat-cell *matCellDef="let element" class="min-w-[100px]">
        <img [src]="element?.icon" class="h-13 w-13 bg-center object-cover rounded-full" alt="provider holder" />
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef class="min-w-[150px]"> Name </mat-header-cell>
      <mat-cell *matCellDef="let element" class="min-w-[150px]">
        <span class="break-words line-clamp-3">
          {{ element?.name }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="menu">
      <mat-header-cell *matHeaderCellDef class="min-w-[70px]"> Menu </mat-header-cell>
      <mat-cell *matCellDef="let element" class="min-w-[70px]">
        <button class="relative -left-2" mat-icon-button id="edit">
          <mat-icon (click)="onEditProvider(element)">edit</mat-icon>
        </button>

        <button class="relative -left-2" mat-icon-button id="edit">
          <mat-icon (click)="onDeleteProvider(element?.id)">delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns" class="h-[72px]"></mat-row>
  </mat-table>
</div>

@if (isLoading) {
  <div class="flex h-full justify-center items-center">
    <mat-spinner></mat-spinner>
  </div>
}
