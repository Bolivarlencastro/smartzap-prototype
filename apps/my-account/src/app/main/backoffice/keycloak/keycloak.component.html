<div class="p-10 w-full">
  <div>
    <a href="assets/exemplo.csv" mat-icon-button aria-label="csv exemplo">
      <mat-icon mat-icon-button color="accent" matTooltip="CSV de exemplo">cloud_download</mat-icon>
    </a>
    <button color="accent" aria-label="delete" (click)="reset()" [disabled]="!fileUpload?.value" mat-icon-button>
      <mat-icon matTooltip="Limpar dados">delete</mat-icon>
    </button>
  </div>
  <div>
    <input type="file" class="p-0" type="file" accept=".csv" (change)="onFileSelected($event)" #fileUpload />
    <button class="mr-2" color="primary" (click)="execute()" [disabled]="!fileUpload?.value" mat-flat-button>
      Enviar
    </button>
    <mat-slide-toggle [(ngModel)]="temporary">Senha temporaria?</mat-slide-toggle>
  </div>
  <mat-divider class="my-2"></mat-divider>

  <table mat-table [dataSource]="dataSource" aria-describedby="email list" class="mat-elevation-z8 w-full">
    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element?.email }}</td>
    </ng-container>

    <!-- Password Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">{{ element?.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
