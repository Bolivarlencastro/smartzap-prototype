<div class="question-list">
  @if (questions$ | async; as questions) {
    @if (!questions.length) {
      <div class="question-list__empty">
        <p>{{ 'COURSE.FORM.QUIZ.QUESTION.EMPTY_LIST_MESSAGE' | transloco }}</p>
      </div>
    }
    @for (question of questions; track question; let i = $index) {
      <div class="question-list__item">
        <div class="question-list__title">{{ i + 1 }}. {{ question.title }}</div>
        <div class="question-list__item__actions">
          <button
            mat-icon-button
            type="button"
            [matTooltip]="'GENERAL.EDIT' | transloco"
            (click)="onEditQuestion(question)"
          >
            <mat-icon class="s-4">edit</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            [matTooltip]="'GENERAL.DELETE' | transloco"
            (click)="onRemoveQuestion(question)"
          >
            <mat-icon class="s-4">delete_outline</mat-icon>
          </button>
        </div>
      </div>
    }
  }
</div>
