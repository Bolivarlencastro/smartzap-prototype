<div class="grid place-content-center gap-4 min-h-100">
  <div class="relative flex justify-center h-26">
    <mat-icon class="s-24 text-disabled">rocket_launch</mat-icon>
    <div class="status-tag rounded-md py-1 px-2 text-white text-xs" [style.background-color]="statusColor">
      {{ statusLabel | transloco }}
    </div>
  </div>

  <div class="flex flex-col items-center">
    <h2 class="text-2xl font-bold text-center leading-10">
      {{ title | transloco }}
    </h2>
    <p class="text-sm max-w-80 text-center font-semibold">
      {{ message | transloco }}
    </p>
  </div>

  <button
    data-test="publish-course-button"
    class="justify-self-center"
    mat-flat-button
    color="primary"
    (click)="publish.emit()"
  >
    {{ 'COURSE.FORM.BUTTON.PUBLISH' | transloco }}
  </button>
</div>
