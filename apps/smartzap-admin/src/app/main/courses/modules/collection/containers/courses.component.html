<mat-drawer-container class="blank grow min-h-0" autosize>
  <!-- SIDE MENU -->
  <mat-drawer #drawer class="h-full" mode="side" position="end">
    <app-course-side-menu [summary]="summary()" (closeMenu)="drawer.toggle()"></app-course-side-menu>
  </mat-drawer>
  <!-- / SIDE MENU -->

  <div class="h-full flex flex-col">
    <!-- HEADER -->
    <div class="h-32 flex items-center pl-8 pr-4">
      <span class="text-2xl" data-test="course-title">{{ 'COURSES.TITLE' | transloco }}</span>
      <div class="ml-auto flex items-center gap-2">
        <button
          data-test="button-open-course-create-dialog"
          mat-flat-button
          color="primary"
          class="w-20"
          routerLink="new/form"
        >
          {{ 'COURSES.CREATE' | transloco }}
        </button>
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon svgIcon="analytics" class="s-6 text-primary"></mat-icon>
        </button>
      </div>
    </div>
    <!-- / HEADER -->

    <kp-table-layout
      class="grow min-h-0"
      [totalItems]="page()?.count || 0"
      [pageIndex]="(page()?.page || 1) - 1"
      [pageSize]="page()?.per_page || 10"
      [searchPlaceholder]="'COURSES.SEARCH'"
      (pageChange)="onPageChange($event)"
      (searchChange)="onSearch($event)"
    >
      <kp-course-filter
        kpTableFilterAfter
        [filters]="filters()"
        [categories]="categories()"
        (filterEvent)="onFilter($event)"
      ></kp-course-filter>

      <app-course-list
        kpTable
        [courses]="courses()"
        [isLoading]="isLoading()"
        [reportButtons]="reportButtons"
        [isAdmin]="isAdmin"
        [currentUserId]="currentUserId"
        (actionSelected)="onCourseAction($event)"
        (sort)="onSort($event)"
      >
      </app-course-list>
    </kp-table-layout>
  </div>
</mat-drawer-container>
