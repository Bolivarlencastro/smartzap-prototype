    <!-- FUSE Splash Screen CSS -->
    <style type="text/css">
      #fuse-splash-screen {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #161616;
        z-index: 99999;
        opacity: 1;
        pointer-events: none;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
      }

      .fuse-splash-screen-hidden {
        opacity: 0 !important;
        transition: all 0.3s ease-in-out;
      }

      #quote {
        font-size: 24px;
        max-width: 70vw;
        text-align: center;
      }

      #loading-message,
      #author,
      #footer {
        font-size: 12px;
      }

      #footer {
        position: absolute;
        bottom: 0;
        padding-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #footer img {
        height: 24px;
        width: auto;
      }

      .progress-bar {
        width: 250px;
        height: 2px;
        background-color: #444;
        border-radius: 4px;
        overflow: hidden;
        margin: 16px 0 12px;
      }

      .progress {
        width: 0;
        height: 100%;
        background-color: #ffffff;
        border-radius: 4px;
        transition: width 3s ease-in-out;
      }
    </style>
    <!-- / FUSE Splash Screen CSS -->
  </head>

  <body>
    <!-- FUSE Splash Screen -->
    <fuse-splash-screen id="fuse-splash-screen">
      <div id="loading-message">Aguarde enquanto sua workspace está sendo carregada.</div>
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <!-- / Progress Bar -->
      <em id="quote"></em>
      <div id="author"></div>
      <div id="footer">
        <div>Desenvolvido por:</div>
        <img src="https://keeps.com.br/wp-content/uploads/2024/03/logo-keeps.webp" alt="keeps logo" />
      </div>
    </fuse-splash-screen>
    <!-- / FUSE Splash Screen -->

    <app></app>

    <script src="assets/scripts/splash-screen.js"></script>
  </body>
