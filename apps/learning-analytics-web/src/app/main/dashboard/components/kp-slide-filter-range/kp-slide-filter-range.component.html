@if (isFilteredByMonth) {
  <mat-slider step="1" class="w-full" [min]="min" [max]="max" [displayWith]="formatLabel" discrete
    ><input matSliderThumb [value]="value" (valueChange)="onChange($event)"
  /></mat-slider>
}

@if (isFilteredByYear) {
  <mat-slider step="1" class="w-full" [min]="min" [max]="max" discrete #ngSlider
    ><input matSliderThumb [value]="value" (valueChange)="onChange($event)"
  /></mat-slider>
}
