<div class="dashboard-card w-auto max-w-full mat-elevation-z4 rounded-md">
  <div class="p-2.5">
    <div class="pr-2.5">
      <div class="text-secondary">{{ subtitle }}</div>
      <div class="text-secondary text-lg font-bold">{{ title }}</div>
      <div class="text-5xl font-semibold leading-none mt-2.5">
        {{ value | number }}
      </div>
    </div>
    <div class="pt-2.5 text-sm flex flex-row">
      @if (target > 0) {
        <div class="text-green-500 flex flex-row items-center justify-self-start">
          <mat-icon class="mr-2.5">trending_up</mat-icon>
          <span>{{ target | number: '1.2-2' }}%</span>
        </div>
      }
      @if (target < 0) {
        <div class="text-red-500 flex flex-row items-center justify-self-start">
          <mat-icon class="mr-2.5">trending_down</mat-icon>
          <span>{{ target | number: '1.2-2' }}%</span>
        </div>
      }
    </div>
  </div>
</div>
