@if (ranges) {
  <div class="w-full flex gap-2 justify-items-start items-center">
    @for (range of ranges | keyvalue; track range) {
      <button
        mat-button
        class="px-46"
        (click)="onClick(range.value)"
        [ngClass]="{ 'bg-primary text-on-primary': selectedRange === range.value }"
      >
        {{ 'GENERAL.' + range.key | transloco }}
      </button>
    }
  </div>
}
