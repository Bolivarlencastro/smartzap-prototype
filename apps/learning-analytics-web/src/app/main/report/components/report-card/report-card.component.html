<div class="h-full flex flex-col p-1">
  @if (showDatails) {
    <div class="flex justify-end items-center mb-2 accent-text">
      <span
        class="mr-1 leading-none"
        [matTooltip]="'REPORTS.KONQUEST_TAB.MESSAGES.REPORT_DETAIL_TOOLTIP' | transloco"
        matTooltipPosition="above"
        data-test="detail-text"
      >
        {{ 'GENERAL.DETAILS' | transloco }}
      </span>
      <mat-icon class="s-3 leading-none" svgIcon="ondemand_video" data-test="detail-icon"></mat-icon>
    </div>
  }
  <mat-card
    appearance="outlined"
    class="flex flex-col justify-between items-center flex-1 cursor-pointer p-8 transition duration-150 ease-out hover:ease-in mat-elevation-z4"
    [class.primary-color]="colored"
    (click)="cardSelected.emit()"
  >
    <mat-icon class="s-9 mb-6" [svgIcon]="svgIcon" data-test="card-icon"></mat-icon>
    <div class="flex justify-center items-center flex-1">
      <h4 class="text-xl text-center">{{ label }}</h4>
    </div>
  </mat-card>
</div>
