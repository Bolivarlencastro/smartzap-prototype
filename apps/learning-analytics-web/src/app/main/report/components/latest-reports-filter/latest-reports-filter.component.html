<div class="flex flex-1 flex-col sm:flex-row gap-6 my-4">
  <form [formGroup]="filterForm" class="flex items-center flex-1 justify-end gap-4">
    <!--Creator name filter-->
    @if (showCreatorInput) {
      <mat-form-field data-test="creator-input" class="w-64" subscriptSizing="dynamic" appearance="outline">
        <input
          type="text"
          class="w-90"
          matInput
          [placeholder]="'REPORT.FILTER.INPUT.LABEL' | transloco"
          formControlName="creatorName"
          autocomplete="off"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    }

    <!--Filter menu-->
    <button matButton="elevated" [matMenuTriggerFor]="menu" type="button">
      <mat-icon>filter_list</mat-icon>
      <span class="ml-2">{{ 'GENERAL.FILTER' | transloco }}</span>
    </button>

    <mat-menu #menu="matMenu" yPosition="below" class="w-72 px-4" (closed)="onFilter()">
      <!--Container used to stop the click events inside the menu from closing it-->
      <div class="flex flex-wrap" (click)="$event.stopPropagation(); $event.preventDefault()">
        <!--Creation date range picker-->
        <mat-form-field class="text-sm w-full cursor-pointer" appearance="outline" (click)="creationRangePicker.open()">
          <mat-label>{{ 'REPORT.FILTER.REQUEST_DATE.TITLE' | transloco }}</mat-label>

          <mat-date-range-input [rangePicker]="creationRangePicker" [min]="minDate" [max]="maxDate">
            <input
              matStartDate
              placeholder="{{ 'REPORT.FILTER.DATE_RANGE.FROM' | transloco }}"
              readonly
              formControlName="startDate"
            />
            <input
              matEndDate
              placeholder="{{ 'REPORT.FILTER.DATE_RANGE.TO' | transloco }}"
              readonly
              formControlName="endDate"
            />
          </mat-date-range-input>

          <mat-datepicker-toggle matSuffix [for]="creationRangePicker"></mat-datepicker-toggle>
          <mat-date-range-picker #creationRangePicker></mat-date-range-picker>
        </mat-form-field>

        <!--Statuses-->
        @if (statuses && statuses.length !== 0) {
          <div class="uppercase font-bold text-xs mb-1">{{ 'GENERAL.STATUS' | transloco }}</div>
          <div class="flex flex-wrap">
            @for (status of statuses; track status) {
              <span
                [reportStatus]="status.name"
                class="cursor-pointer mr-2 mb-2"
                [ngClass]="{ 'opacity-50': !status.active }"
                (click)="statusChanged(status)"
              >
                {{ 'REPORT.STATUS.' + status.name | transloco }}
              </span>
            }
          </div>
        }

        <!--Clear filter-->
        <button mat-icon-button class="ml-auto" (click)="resetFilter()">
          <mat-icon [matTooltip]="'GENERAL.CLEAR_FILTER' | transloco"> delete_forever </mat-icon>
        </button>
      </div>
    </mat-menu>
  </form>
</div>
