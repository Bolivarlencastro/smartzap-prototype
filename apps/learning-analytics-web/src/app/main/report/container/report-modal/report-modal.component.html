<div class="relative h-full pt-6 flex flex-col">
  <span class="text-2xl mb-4 px-6">{{ data.title | transloco }}</span>
  <span class="break-words mb-6 px-6">{{ data.subtitle | transloco }}</span>

  <!-- LIST -->
  <app-report-modal-list
    [items]="items$ | async"
    [columnTitle]="data.columnTitle"
    [selectionLabel]="data.selectionLabel"
    [isLoading]="isLoading$ | async"
    [validFilter]="validFilter"
    (searchChanged)="onSearch($event)"
    (loadMoreItems)="fetchMoreItems()"
    (submitEvent)="reportGenerate()"
    #selectionList
  ></app-report-modal-list>
  <!-- / LIST  -->

  <!-- CLOSE BUTTON -->
  <button mat-icon-button mat-dialog-close class="absolute top-3 right-3">
    <mat-icon>close</mat-icon>
  </button>
  <!-- / CLOSE BUTTON -->
</div>
