<div class="flex flex-col p-6">
  <span class="text-2xl mb-3">{{ 'EXTEND_DEADLINE_DIALOG.TITLE' | transloco }}</span>

  <span
    class="text-sm mb-6 break-words"
    [innerHTML]="
      label
        | transloco
          : {
              user: data.user,
              name: data.learningObjectName,
              start_date: data.startDate | date: 'shortDate',
              goal_date: data.currentGoalDate | date: 'shortDate',
            }
    "
  ></span>

  <span class="text-sm mb-3">{{ subTitle | transloco }}</span>

  <form class="flex flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field class="flex-auto text-base" color="primary" appearance="outline">
      <mat-label class="text-base">{{ 'EXTEND_DEADLINE_DIALOG.INPUT_LABEL' | transloco }} </mat-label>
      <input formControlName="goalDate" [min]="minDate" matInput [matDatepicker]="picker" />
      <mat-hint>DD/MM/YYYY</mat-hint>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="mt-8 flex gap-2 justify-end">
      <button mat-button mat-dialog-close class="h-10 w-22 text-primary">
        {{ 'EXTEND_DEADLINE_DIALOG.CANCEL_BUTTON' | transloco }}
      </button>
      <button mat-raised-button id="submit" color="primary" class="h-10 w-24" type="submit" [disabled]="form.invalid">
        {{ 'EXTEND_DEADLINE_DIALOG.CONFIRM_BUTTON' | transloco }}
      </button>
    </div>
  </form>
</div>
