<section class="mx-auto max-w-[1328px] px-8 sm:px-12">
  <kp-dashboard-header [label]="sectionTitle" [actionButtonLink]="actionButtonLink"></kp-dashboard-header>

  <div class="cards-container">
    @for (pulse of cardsData; track pulse.id) {
      <kp-pulse-card [pulse]="pulse" (click)="onCardClick(pulse)" (favoriteToggle)="onBookmark(pulse)"></kp-pulse-card>
    }

    @if (loading) {
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
    }
  </div>
</section>
