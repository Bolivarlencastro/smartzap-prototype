<section class="mx-auto max-w-[1328px] px-8 sm:px-12">
  <kp-dashboard-header [label]="sectionTitle" [actionButtonLink]="actionButtonLink"></kp-dashboard-header>

  <div class="cards-container" [ngClass]="containerOrientation">
    @for (cardData of cardsData; track cardData) {
      <kp-learn-content-card
        [learnContent]="cardData"
        [actions]="cardData.actions"
        [orientation]="cardOrientation"
        (cardAction)="onCardAction($event, cardData)"
        (click)="onCardClick(cardData)"
      ></kp-learn-content-card>
    }

    @if (loading) {
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
      <ngx-skeleton-loader [theme]="loaderTheme" animation="pulse"></ngx-skeleton-loader>
    }
  </div>
</section>
