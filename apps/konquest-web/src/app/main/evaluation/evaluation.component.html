<div [class.py-4]="isOnCourse">
  @if (isOnCourse) {
    <div>
      <h2 class="mb-4 text-xl">
        {{ 'COURSE.EVALUATION.TITLE' | transloco }}
      </h2>
      <mat-divider></mat-divider>
    </div>
  }
  <div mat-dialog-content class="flex flex-col" [class.max-h-none]="isOnCourse">
    <app-evaluation-content
      [questions]="questions$ | async"
      [isOnCourse]="isOnCourse"
      [disabled]="!!evaluation"
      [form]="evaluationForm"
    ></app-evaluation-content>
  </div>
  <div mat-dialog-actions [class.pt-4]="isOnCourse" class="flex justify-end">
    <button
      mat-flat-button
      [class.submit-evaluation-override]="isOnCourse"
      (click)="save()"
      [disabled]="evaluationForm.invalid || evaluation"
      id="button-confirm-ok"
      color="primary"
    >
      {{ 'GENERAL.SUBMIT' | transloco }}
    </button>
  </div>
</div>
