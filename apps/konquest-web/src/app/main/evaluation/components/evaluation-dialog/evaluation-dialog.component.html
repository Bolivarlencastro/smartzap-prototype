<div mat-dialog-title class="flex justify-between">
  <span class="text-lg">
    {{ 'COURSE.EVALUATION.TITLE' | transloco }}
  </span>
  <button
    data-test="evaluation-dialog.close"
    mat-icon-button
    mat-dialog-close
    [attr.aria-label]="'GENERAL.CLOSE' | transloco"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
<app-evaluation
  [missionId]="mission.id"
  [isExternalMission]="isExternalMission"
  [enrollmentId]="mission.enrollment?.id"
  [isOnCourse]="false"
></app-evaluation>
