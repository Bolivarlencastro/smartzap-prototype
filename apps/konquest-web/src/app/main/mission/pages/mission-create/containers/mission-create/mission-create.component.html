<div class="flex flex-col w-full min-w-0 sm:absolute sm:inset-0 sm:overflow-hidden">
  <mat-drawer-container class="flex-auto sm:h-full">
    <mat-drawer mode="side" opened>
      <div class="py-6 px-9">
        <h2 class="text-2xl font-black mb-2">{{ navTitle$ | async | transloco }}</h2>
        <p>{{ 'MISSION.CREATE.NAVIGATION.NAV_MENU_SUBTITLE' | transloco }}</p>
      </div>
      <app-mission-nav-menu
        [missionModel]="missionModel$ | async"
        [missionDefined]="missionDefined$ | async"
      ></app-mission-nav-menu>
    </mat-drawer>
    <mat-drawer-content class="p-12">
      <router-outlet></router-outlet>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
