<app-mission-information-form
  #infoForm
  [missionModel]="missionModel$ | async"
  [types]="missionTypes$ | async"
  [categories]="categories$ | async"
  [mission]="mission$ | async"
  [isNormativeActive]="isNormativeActive$ | async"
  (formSubmit)="saveMission($event)"
  [languages]="languages()"
></app-mission-information-form>
