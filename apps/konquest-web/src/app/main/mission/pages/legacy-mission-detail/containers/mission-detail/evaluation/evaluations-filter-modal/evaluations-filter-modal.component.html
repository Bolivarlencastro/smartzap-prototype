<form [formGroup]="filterFormGroup" (ngSubmit)="onFilter()">
  <p mat-dialog-title class="text-2xl">{{ 'GENERAL.FILTERS' | transloco }}</p>
  <div mat-dialog-content class="py-2">
    @if (viewModel$ | async; as vm) {
      <kp-filter-container
        [filterOptions]="filterOptions"
        [initialControllerState]="vm.filterState?.controllerState"
        [initialFilterValue]="vm.filterState?.filter"
      >
      </kp-filter-container>
    }
  </div>
  <div mat-dialog-actions class="flex justify-end">
    <button mat-button (click)="clearFilter()" type="button">{{ 'GENERAL.CLEAR_FILTER' | transloco }}</button>
    <button mat-flat-button color="primary" [disabled]="filterFormGroup.invalid">
      {{ 'GENERAL.FILTER' | transloco }}
    </button>
  </div>
</form>
