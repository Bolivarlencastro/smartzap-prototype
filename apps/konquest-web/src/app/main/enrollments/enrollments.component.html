<div class="flex items-center px-6 w-full h-20">
  <span class="text-2xl font-semibold">
    {{ 'NAVIGATION.ENROLLMENTS' | transloco }}
  </span>
</div>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" [mat-stretch-tabs]="false" fitInkBarToContent>
  @for (link of navLinks; track link) {
    <a mat-tab-link [routerLink]="link.path" routerLinkActive #rla="routerLinkActive" [active]="rla.isActive">
      {{ displayNavLabel(link) | transloco }}
    </a>
  }
</nav>

<mat-tab-nav-panel class="grow" #tabPanel class="grow flex flex-col overflow-hidden">
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
