<div class="app-group-learning-trail-create">
  <kp-group-linked-dialog-header
    [title]="'GROUP_LEARNING_TRAIL.DIALOG.CREATE_TITLE' | transloco"
  ></kp-group-linked-dialog-header>

  <app-group-linked-dialog-content
    [items]="items$ | async"
    [columns]="columns"
    [selectedItems]="selection"
    [isLoading]="isLoading$ | async"
    [total]="total$ | async"
    [page]="page$ | async"
    (selectionEvent)="toggleSelection($event.id)"
    (selectAllEvent)="selectAll($event)"
    (filterEvent)="applyFilter($event)"
    (scrollEvent)="onScroll($event)"
    [selectionLabel]="'GROUP_LEARNING_TRAIL.SELECTION_LABEL' | kpPluralizeTranslate: { value: selectionSize }"
  >
  </app-group-linked-dialog-content>

  <app-group-linked-dialog-footer
    [size]="selectionSize"
    [cycles]="cycles$ | async"
    (submitEvent)="onSubmit($event)"
    (filterCycle)="onFilterCycle($event)"
  ></app-group-linked-dialog-footer>
</div>
