<div class="app-group-channel-create">
  <kp-group-linked-dialog-header
    [title]="'GROUP_CHANNEL.DIALOG.CREATE_TITLE' | transloco"
  ></kp-group-linked-dialog-header>

  <app-group-linked-dialog-content
    [items]="items$ | async"
    [columns]="columns"
    [selectedItems]="selection"
    [isLoading]="isLoading$ | async"
    [total]="total$ | async"
    [page]="page$ | async"
    (selectionEvent)="toggleSelection($event.id)"
    (selectAllEvent)="selectAll($event)"
    (filterEvent)="applyFilter($event)"
    (scrollEvent)="onScroll($event)"
    [selectionLabel]="'GROUP_CHANNEL.SELECTION_LABEL' | kpPluralizeTranslate: { value: selectionSize }"
  >
  </app-group-linked-dialog-content>

  <app-group-linked-dialog-footer
    [displayEnrollmentSettings]="false"
    [size]="selectionSize"
    (submitEvent)="onSubmit()"
  ></app-group-linked-dialog-footer>
</div>
