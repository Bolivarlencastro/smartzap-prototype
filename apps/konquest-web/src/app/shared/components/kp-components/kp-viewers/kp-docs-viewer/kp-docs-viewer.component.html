<div class="kp-docs-viewer relative">
  @if (url) {
    <iframe
      [src]="url | kpDocsUrl | kpSafeUrl"
      class="w-full h-full"
      allow="fullscreen"
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
      title="Docs Viewer Frame"
    ></iframe>
  }

  @if (usingOfficeViewer) {
    <div class="h-[21px] w-50 absolute download-blocker" [ngClass]="contentType | lowercase"></div>
  }
</div>
