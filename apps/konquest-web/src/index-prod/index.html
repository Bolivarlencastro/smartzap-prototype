        justify-content: center;

        text-align: center;

        position: absolute;
        bottom: 0;
        padding-bottom: 12px;

        height: 24px;

        height: 2px;
        background-color: #444;

        width: 0;
        height: 100%;
        background-color: #ffffff;
        border-radius: 4px;
        transition: width 3s ease-in-out;
